name = "kidezio-api"
main = "worker.js"
compatibility_date = "2024-05-01"

[[d1_databases]]
binding = "DB"
database_name = "kidezio-db"
database_id = "6aea60ce-c62f-406f-9a5b-7643ed55b785"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "kidezio-videos"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]
